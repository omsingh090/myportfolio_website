<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCert2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a180e"/>
      <stop offset="50%" stop-color="#07120a"/>
      <stop offset="100%" stop-color="#040905"/>
    </linearGradient>
    <linearGradient id="nvGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="780" height="500" rx="16" fill="url(#bgCert2)" stroke="url(#nvGreen)" stroke-width="3"/>
  <rect x="25" y="25" width="750" height="470" rx="12" fill="none" stroke="rgba(118, 185, 0, 0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- NVIDIA Green Highlights -->
  <path d="M 35 60 L 35 35 L 60 35" fill="none" stroke="#76b900" stroke-width="3"/>
  <path d="M 765 60 L 765 35 L 740 35" fill="none" stroke="#76b900" stroke-width="3"/>
  <path d="M 35 460 L 35 485 L 60 485" fill="none" stroke="#76b900" stroke-width="3"/>
  <path d="M 765 460 L 765 485 L 740 485" fill="none" stroke="#76b900" stroke-width="3"/>

  <!-- Issuer Header -->
  <text x="400" y="75" fill="#76b900" font-family="'Geist', sans-serif" font-size="16" font-weight="800" letter-spacing="6" text-anchor="middle">NVIDIA</text>
  <text x="400" y="102" fill="#88a88e" font-family="'Geist', sans-serif" font-size="12" letter-spacing="3" text-anchor="middle">DEEP LEARNING INSTITUTE &amp; AI ACCELERATION</text>

  <!-- Title -->
  <text x="400" y="160" fill="#ffffff" font-family="'Geist', sans-serif" font-size="28" font-weight="700" letter-spacing="2" text-anchor="middle">PROFESSIONAL CERTIFICATION</text>
  <line x1="260" y1="180" x2="540" y2="180" stroke="url(#nvGreen)" stroke-width="2"/>

  <!-- Presented to -->
  <text x="400" y="225" fill="#9ab69f" font-family="'Geist', sans-serif" font-size="14" font-style="italic" text-anchor="middle">This certifies that</text>
  <text x="400" y="275" fill="#ffffff" font-family="'Geist', sans-serif" font-size="36" font-weight="800" letter-spacing="3" text-anchor="middle">OM SINGH</text>

  <!-- Credential Details -->
  <text x="400" y="320" fill="#9ab69f" font-family="'Geist', sans-serif" font-size="13" text-anchor="middle">has successfully fulfilled all requirements and earned the official designation of</text>
  <text x="400" y="365" fill="url(#nvGreen)" font-family="'Geist', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" text-anchor="middle">NVIDIA-Certified Professional in Agentic AI</text>

  <!-- Seal -->
  <g transform="translate(130, 425)">
    <circle cx="0" cy="0" r="38" fill="#0d2414" stroke="#76b900" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="0" y="-8" fill="#76b900" font-family="'Geist', sans-serif" font-size="9" font-weight="800" text-anchor="middle">NVIDIA</text>
    <text x="0" y="8" fill="#ffffff" font-family="'Geist', sans-serif" font-size="8" font-weight="700" text-anchor="middle">CERTIFIED</text>
    <text x="0" y="20" fill="#76b900" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">2026</text>
  </g>

  <!-- Verification ID -->
  <g transform="translate(620, 435)">
    <line x1="-100" y1="0" x2="60" y2="0" stroke="#25472e" stroke-width="1.5"/>
    <text x="-20" y="18" fill="#9ab69f" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">NVIDIA AI Institute</text>
    <text x="-20" y="32" fill="#58795e" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">Credential ID: NV-AGI-2026-992</text>
  </g>
</svg>
