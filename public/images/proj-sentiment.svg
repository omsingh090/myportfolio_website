<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1725"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#bg5)" stroke="#173456" stroke-width="2"/>
  <!-- NLP bubbles -->
  <rect x="90" y="90" width="200" height="50" rx="15" fill="#122742" stroke="#1d9bf0" stroke-width="1.5"/>
  <text x="190" y="120" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">"Loved the new AI feature!"</text>
  <rect x="130" y="160" width="200" height="50" rx="15" fill="#122742" stroke="#1d9bf0" stroke-width="1.5"/>
  <text x="230" y="190" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">"Server response latency high"</text>
  <!-- Classification cards -->
  <rect x="380" y="90" width="140" height="40" rx="8" fill="#0d2e1b" stroke="#00ff88" stroke-width="1.5"/>
  <text x="450" y="115" fill="#00ff88" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Positive (94%)</text>
  <rect x="380" y="160" width="140" height="40" rx="8" fill="#381313" stroke="#ff4444" stroke-width="1.5"/>
  <text x="450" y="185" fill="#ff4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Negative (88%)</text>
  <path d="M 290 115 L 380 110" stroke="#1d9bf0" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 330 185 L 380 180" stroke="#1d9bf0" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="30" y="45" fill="#1d9bf0" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2">TWITTER NLP SENTIMENT ANALYSIS</text>
</svg>
