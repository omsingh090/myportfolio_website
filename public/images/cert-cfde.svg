<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCert1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="50%" stop-color="#0f2038"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f9e29d"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="10" y="10" width="780" height="500" rx="16" fill="url(#bgCert1)" stroke="url(#goldBorder)" stroke-width="4"/>
  <rect x="25" y="25" width="750" height="470" rx="12" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Corner ornaments -->
  <path d="M 35 60 L 35 35 L 60 35" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  <path d="M 765 60 L 765 35 L 740 35" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  <path d="M 35 460 L 35 485 L 60 485" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  <path d="M 765 460 L 765 485 L 740 485" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>

  <!-- Issuer Header -->
  <text x="400" y="75" fill="#f9e29d" font-family="'Geist', sans-serif" font-size="14" font-weight="700" letter-spacing="5" text-anchor="middle">ASSOCIATION OF DATA SCIENTISTS (ADaSci)</text>
  <text x="400" y="105" fill="#8ba7c7" font-family="'Geist', sans-serif" font-size="12" letter-spacing="3" text-anchor="middle">GLOBAL ACCREDITATION BOARD FOR DATA SCIENCE &amp; AI</text>

  <!-- Certificate Title -->
  <text x="400" y="165" fill="#ffffff" font-family="'Geist', sans-serif" font-size="28" font-weight="700" letter-spacing="2" text-anchor="middle">CERTIFICATE OF ACCREDITATION</text>
  <line x1="250" y1="185" x2="550" y2="185" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Presented to -->
  <text x="400" y="225" fill="#a0aec0" font-family="'Geist', sans-serif" font-size="14" font-style="italic" text-anchor="middle">This is proudly conferred upon</text>
  <text x="400" y="275" fill="#ffffff" font-family="'Geist', sans-serif" font-size="36" font-weight="800" letter-spacing="3" text-anchor="middle">OM SINGH</text>

  <!-- For Achieving -->
  <text x="400" y="320" fill="#a0aec0" font-family="'Geist', sans-serif" font-size="13" text-anchor="middle">for successfully demonstrating advanced competency and achieving the professional credential</text>
  <text x="400" y="365" fill="url(#blueAccent)" font-family="'Geist', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" text-anchor="middle">Certified Forward Deployed Engineer (CFDE)</text>

  <!-- Gold Seal -->
  <g transform="translate(130, 425)">
    <circle cx="0" cy="0" r="38" fill="#13233c" stroke="url(#goldBorder)" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f9e29d" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="0" y="-8" fill="#f9e29d" font-family="'Geist', sans-serif" font-size="9" font-weight="800" text-anchor="middle">ADaSci</text>
    <text x="0" y="8" fill="#ffffff" font-family="'Geist', sans-serif" font-size="8" font-weight="700" text-anchor="middle">VERIFIED</text>
    <text x="0" y="20" fill="#f9e29d" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">2026</text>
  </g>

  <!-- Signatures & Details -->
  <g transform="translate(620, 435)">
    <line x1="-100" y1="0" x2="60" y2="0" stroke="#4a5568" stroke-width="1.5"/>
    <text x="-20" y="18" fill="#a0aec0" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Certification Board</text>
    <text x="-20" y="32" fill="#718096" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">Credential ID: CFDE-2026-AD849</text>
  </g>
</svg>
