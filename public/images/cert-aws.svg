<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCert3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#192032"/>
      <stop offset="100%" stop-color="#0a0d15"/>
    </linearGradient>
    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="780" height="500" rx="16" fill="url(#bgCert3)" stroke="url(#awsOrange)" stroke-width="3"/>
  <rect x="25" y="25" width="750" height="470" rx="12" fill="none" stroke="rgba(255, 153, 0, 0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Accents -->
  <path d="M 35 60 L 35 35 L 60 35" fill="none" stroke="#ff9900" stroke-width="3"/>
  <path d="M 765 60 L 765 35 L 740 35" fill="none" stroke="#ff9900" stroke-width="3"/>
  <path d="M 35 460 L 35 485 L 60 485" fill="none" stroke="#ff9900" stroke-width="3"/>
  <path d="M 765 460 L 765 485 L 740 485" fill="none" stroke="#ff9900" stroke-width="3"/>

  <!-- Issuer Header -->
  <text x="400" y="75" fill="#ff9900" font-family="'Geist', sans-serif" font-size="16" font-weight="800" letter-spacing="6" text-anchor="middle">AMAZON WEB SERVICES</text>
  <text x="400" y="102" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="12" letter-spacing="3" text-anchor="middle">AWS TRAINING &amp; CERTIFICATION</text>

  <!-- Title -->
  <text x="400" y="160" fill="#ffffff" font-family="'Geist', sans-serif" font-size="28" font-weight="700" letter-spacing="2" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
  <line x1="260" y1="180" x2="540" y2="180" stroke="url(#awsOrange)" stroke-width="2"/>

  <!-- Presented to -->
  <text x="400" y="225" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="14" font-style="italic" text-anchor="middle">This is awarded to</text>
  <text x="400" y="275" fill="#ffffff" font-family="'Geist', sans-serif" font-size="36" font-weight="800" letter-spacing="3" text-anchor="middle">OM SINGH</text>

  <!-- Credential Details -->
  <text x="400" y="320" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="13" text-anchor="middle">for successfully demonstrating demonstrated machine learning expertise on AWS</text>
  <text x="400" y="365" fill="url(#awsOrange)" font-family="'Geist', sans-serif" font-size="23" font-weight="800" letter-spacing="1.2" text-anchor="middle">AWS Certified Machine Learning Engineer - Associate</text>

  <!-- Seal -->
  <g transform="translate(130, 425)">
    <circle cx="0" cy="0" r="38" fill="#232f3e" stroke="#ff9900" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ffb84d" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="0" y="-8" fill="#ff9900" font-family="'Geist', sans-serif" font-size="9" font-weight="800" text-anchor="middle">AWS</text>
    <text x="0" y="8" fill="#ffffff" font-family="'Geist', sans-serif" font-size="8" font-weight="700" text-anchor="middle">CERTIFIED</text>
    <text x="0" y="20" fill="#ff9900" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">2026</text>
  </g>

  <!-- Verification ID -->
  <g transform="translate(620, 435)">
    <line x1="-100" y1="0" x2="60" y2="0" stroke="#334155" stroke-width="1.5"/>
    <text x="-20" y="18" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">AWS Global Validation</text>
    <text x="-20" y="32" fill="#64748b" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">Validation ID: AWS-MLE-2026-773</text>
  </g>
</svg>
